name: 🚀 Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: 🟢 Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: 📦 Install dependencies (for validation)
      run: npm install

    - name: 🧪 Run basic check (optional but recommended)
      run: |
        echo "Running basic check..."
        node -e "console.log('Build OK')"

    - name: 📤 Copy files to VPS
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        source: "."
        target: "/root/grocerybackend"
        rm: false

    - name: 🚀 Deploy on VPS
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        script: |
          set -e

          cd /root/grocerybackend

          echo "📦 Installing dependencies..."
          npm install --omit=dev

          echo "🔄 Restarting app..."

          if pm2 describe GroceryBackendService > /dev/null; then
            pm2 restart GroceryBackendService
          else
            pm2 start src/app.js --name GroceryBackendService
          fi

          pm2 save
