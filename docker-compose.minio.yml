# Local MinIO for development image storage.
#   docker compose -f docker-compose.minio.yml up -d
# Console:  http://localhost:9001  (login with the root user/password below)
# API:      http://localhost:9000
#
# Then set in your .env:
#   MINIO_ENDPOINT=localhost
#   MINIO_PORT=9000
#   MINIO_USE_SSL=false
#   MINIO_ACCESS_KEY=minioadmin
#   MINIO_SECRET_KEY=minioadmin
#   MINIO_BUCKET=grocery-images
# The bucket is auto-created (with public-read) by the backend on startup.

services:
  minio:
    image: minio/minio:latest
    container_name: grocery-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  minio-data:
